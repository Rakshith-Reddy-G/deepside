services:
  - type: web
    name: deepside
    env: python
    buildCommand: "pip install -r requirements.txt && python ml/train.py && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn DeepSide.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: deepside-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".render.com"

databases:
  - name: deepside-db
    plan: free
